spring.application.name=developer-portfolio
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Render par application HTTPS par chalti hai, isliye production ke liye secure true hona chahiye (Environment variable se controlled)
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Database Configuration (Render environment variables fallback ke sath)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production par 'always' ki jagah 'never' ya 'update'/'validate' rakhna safe rehta hai taki data wipe na ho
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin Credentials
portfolio.admin.username=${portfolio.admin.username}
portfolio.admin.password=${portfolio.admin.password}

# Mail Configuration (Resend API / SMTP)
spring.mail.host=smtp.resend.com
spring.mail.port=443
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
resend.from-email=onboarding@resend.dev

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.test-connection=false

spring.jackson.deserialization.fail-on-unknown-properties=true
portfolio.contact.recipient=gourav.jv9588@gmail.com
portfolio.contact.sender=onboarding@resend.dev