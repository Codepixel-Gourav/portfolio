spring.application.name=developer-portfolio
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin Credentials (Fixed)
portfolio.admin.username=${portfolio.admin.username}
portfolio.admin.password=${portfolio.admin.password}

# Resend API Key Config
resend.api.key=${RESEND_API_KEY}

spring.jackson.deserialization.fail-on-unknown-properties=true
portfolio.contact.recipient=gourav.jv9588@gmail.com
portfolio.contact.sender=onboarding@resend.dev
